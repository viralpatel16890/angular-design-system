<div class="ds-empty-state" role="status">
  <div class="ds-empty-state__icon" aria-hidden="true">
    <ng-content select="[icon]" />
  </div>

  @if (title()) {
    <h3 class="ds-empty-state__title">{{ title() }}</h3>
  }

  @if (description()) {
    <p class="ds-empty-state__description">{{ description() }}</p>
  }

  <div class="ds-empty-state__action">
    <ng-content select="[action]" />
  </div>
</div>
