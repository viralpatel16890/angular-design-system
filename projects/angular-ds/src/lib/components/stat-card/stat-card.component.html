<div [class]="classes()">
  <div class="ds-stat__header">
    <span class="ds-stat__label">{{ label() }}</span>
    <span class="ds-stat__icon" aria-hidden="true">{{ icon() }}</span>
  </div>
  <div class="ds-stat__value">
    @if (prefix()) {
      <span class="ds-stat__affix">{{ prefix() }}</span>
    }
    <span class="ds-stat__number">{{ formattedValue() }}</span>
    @if (suffix()) {
      <span class="ds-stat__affix">{{ suffix() }}</span>
    }
  </div>
  @if (hasTrend() || caption()) {
    <div class="ds-stat__footer">
      @if (hasTrend()) {
        <span
          class="ds-stat__trend"
          [class.ds-stat__trend--up]="trendValue() >= 0"
          [class.ds-stat__trend--down]="trendValue() < 0"
        >
          {{ trendValue() >= 0 ? '▲' : '▼' }}&nbsp;{{ absTrend() | number: '1.1-1' }}%
        </span>
      }
      @if (caption()) {
        <span class="ds-stat__caption">{{ caption() }}</span>
      }
    </div>
  }
</div>
